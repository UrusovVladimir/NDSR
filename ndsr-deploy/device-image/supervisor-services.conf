[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startretries=3
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xvfb]
command=Xvfb :0 -screen 0 1920x1080x24
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -forever -display :0 -rfbport 5900 -passwd %(ENV_VNC_PASSWORD)s -shared -noxdamage
autostart=true
autorestart=true
user=root
environment=DISPLAY=":0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=bash -c "sleep 10 && export DISPLAY=:0 && export XAUTHORITY=/root/.Xauthority && startxfce4"
autostart=true
autorestart=true
user=root
environment=DISPLAY=":0",HOME="/root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify 6080 localhost:5900 --web=/usr/share/novnc/
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:changeContainersIp]
command=/usr/bin/changeContainersIp.sh
autostart=true
autorestart=true
startretries=3
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:monitorRoutes]
command=/usr/bin/monitorRoutes.sh
autostart=true
autorestart=true
startretries=3
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tftp]
command=/usr/sbin/atftpd --daemon --no-fork --port 69 --bind-address 0.0.0.0 /tftp
autostart=true
autorestart=true
startretries=3
user=root
stdout_logfile=/var/log/tftp.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/tftp.err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2

; Закрывает Firefox, если к noVNC FIREFOX_IDLE_MIN минут никто не подключён
; (открытый через VNC и брошенный Firefox держал до 1,3 ГБ и ~500 процессов)
[program:firefoxIdleGuard]
command=/usr/bin/firefox-idle-guard.sh
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
