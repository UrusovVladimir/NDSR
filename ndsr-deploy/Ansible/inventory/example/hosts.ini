# Образец inventory стенда. Скопируйте каталог example в inventory/<ваш-стенд>/
# и заполните адреса — в репозитории реальных адресов и паролей нет.
#   cp -r inventory/example inventory/<стенд>
#   ansible-playbook -i inventory/<стенд>/hosts.ini ndsrAppCompose.yml --ask-vault-pass
#
# Docker-хост стенда (TRASP — имя хоста в плейбуках, менять не нужно)
[docker_host]
TRASP ansible_host=<адрес docker-хоста> ansible_port=<ssh-порт, напр. 9678> ansible_user=<пользователь> ansible_ssh_private_key_file=<путь к ключу>

# CFK-контейнеры (по одному на модель Keenetic): SSH через проброс портов хоста
[containers]
# KN-2710 ansible_host=<адрес docker-хоста> ansible_port=<ssh-порт контейнера> ansible_user=debian id=<id> port=<web-порт>

[containers:vars]
ansible_host_key_checking=false
